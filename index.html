<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- cobre áreas seguras (iOS) e melhora cálculo da viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <!-- Esconder barra de URL no Android Chrome -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.json" />
  <title>Vision Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
    }

    /* Logo fixo no topo */
    #logo {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 240px;
      width: 100%;
      height: auto;
      animation: fadeIn 1s ease;
      z-index: 3;
    }

    /* Rodapé */
    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
      letter-spacing: 1px;
      user-select: none;
      transition: opacity 0.5s ease;
      z-index: 3;
    }
    footer.fade-out { opacity: 0; }
    
    /* Link do rodapé */
    footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    footer a:hover {
      color: rgba(255, 255, 255, 1);
      text-decoration: underline;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

    #codigoInput {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 20px; padding: 40px; border-radius: 12px;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(6px);
      width: 90%; max-width: 320px; animation: fadeIn 0.8s ease forwards;
      margin-top: 120px; /* espaço para o logo */
      z-index: 3;
    }
    #codigoInput.fade-out { animation: fadeOut 0.6s ease forwards; }

    #codigoTela {
      padding: 14px; font-size: 1.2rem; width: 100%; max-width: 300px;
      border: none; border-radius: 8px; outline: none; text-align: center;
      background-color: #fff;
      color: #000;
    }
    #codigoInput button {
      padding: 14px 24px; font-size: 1.2rem; background: #007bff; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
      width: 100%; max-width: 300px;
    }
    #codigoInput button:hover { background: #0056b3; }

    @media (max-width: 768px) {
      #codigoInput { padding: 30px; gap: 16px; }
      #codigoTela, #codigoInput button { font-size: 1rem; }
      footer { font-size: 12px; }
    }

    /* Mídia ocupa 100% da viewport (sem “filete” nas bordas).
       O JS altera object-fit para cover/contain conforme regras e orientação. */
    video, img {
      position: fixed;
      inset: -1px; /* bleed 1px */
      width: calc(100dvw + 2px);
      height: calc(100dvh + 2px);
      width: calc(100vw + 2px);   /* fallback */
      height: calc(100vh + 2px);  /* fallback */

      object-fit: cover;            /* fallback ate o JS aplicar a regra do tipo */
      object-position: center center;
      background: #000;
      border: 0;
      outline: none;
      display: block;
      backface-visibility: hidden;
      transform: translateZ(0);
      z-index: 1;
      opacity: 1;
      transition: opacity 0.1s ease-in-out;
      transform-origin: center center;
    }
    video { object-fit: cover; }
    img { object-fit: cover; }
    body[data-player-mode="login"] video,
    body[data-player-mode="login"] #imgPlayer {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      z-index: -1 !important;
    }

    /* Quando a orientacao desejada no banco divergir da tela fisica, o player gira o conteudo. */
    html[data-rotate-content="true"] video,
    html[data-rotate-content="true"] #imgPlayer {
      /* Tela fisica em uma orientacao, conteudo em outra. */
      inset: auto;
      top: 50%;
      left: 50%;
      width: calc(100dvh + 2px);
      height: calc(100dvw + 2px);
      width: calc(100vh + 2px);   /* fallback */
      height: calc(100vw + 2px);  /* fallback */
      transform: translate(-50%, -50%) rotate(90deg);
    }
    
    /* Elemento oculto mas pronto para exibir */
    video.hidden-ready, img.hidden-ready {
      opacity: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Respeita rotação EXIF de fotos verticais */
    img { image-orientation: from-image; }

    /* ── Feed de informativos (overlay inline, sem iframe) ── */
    #feedPlayer {
      display: none; position: fixed; inset: 0; z-index: 5;
      background: #000; overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #feed-carousel { position: relative; width: 100%; height: 100%; }
    .feed-slide {
      position: absolute; inset: 0; opacity: 0;
      transition: opacity 0.9s ease; pointer-events: none;
    }
    .feed-slide.active { opacity: 1; pointer-events: auto; }
    .feed-slide-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      background-repeat: no-repeat; background-color: #111;
    }
    .feed-slide-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom,
        rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.10) 40%,
        rgba(0,0,0,0.80) 62%, rgba(0,0,0,0.97) 100%);
    }
    .feed-no-image .feed-slide-bg {
      background: linear-gradient(160deg, #0a2a5e 0%, #041226 100%);
    }
    .feed-slide-content {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 2;
      padding: clamp(14px,4vmin,28px) clamp(12px,3vmin,26px) clamp(36px,6vmin,52px);
    }
    .feed-slide-tag {
      display: inline-block; background: #f5a623; color: #000;
      font-size: clamp(0.48rem,1.4vmin,0.65rem); font-weight: 800;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 3px;
      margin-bottom: clamp(6px,1.8vmin,14px);
    }
    .feed-slide-title {
      font-size: clamp(1rem,3.8vmin,1.85rem); font-weight: 800;
      color: #fff; line-height: 1.2;
      margin-bottom: clamp(6px,1.8vmin,14px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    .feed-slide-desc {
      font-size: clamp(0.68rem,1.7vmin,0.9rem); color: #ccc; line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 3;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .feed-slide-meta {
      display: flex; align-items: center; gap: 10px;
      margin-top: clamp(6px,1.8vmin,16px);
    }
    .feed-slide-source { font-size: clamp(0.52rem,1.3vmin,0.7rem); font-weight: 700; color: #f5a623; text-transform: uppercase; letter-spacing: 1px; }
    .feed-slide-date   { font-size: clamp(0.52rem,1.3vmin,0.7rem); color: #666; }
    #feed-progress {
      position: fixed; bottom: 0; left: 0; height: 4px;
      background: #f5a623; width: 0%; z-index: 20; transition: width linear;
    }
    #feed-dots {
      position: fixed; top: 50%; right: 16px;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 10px; z-index: 20;
    }
    .feed-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: background 0.3s, transform 0.3s;
    }
    .feed-dot.active { background: #f5a623; transform: scale(1.6); }
    #feed-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      padding: clamp(10px,2.5vmin,18px) clamp(12px,3vmin,22px);
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
    }
    #feed-header-title { font-size: clamp(0.52rem,1.4vmin,0.72rem); font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.5); text-transform: uppercase; }
    #feed-header-clock { font-size: clamp(0.52rem,1.4vmin,0.72rem); color: rgba(255,255,255,0.35); font-variant-numeric: tabular-nums; }
    #feed-overlay {
      position: absolute; inset: 0; background: #000; z-index: 99;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    }
    #feed-overlay-text { color: #555; font-size: clamp(0.7rem,1.9vmin,0.88rem); letter-spacing: 1px; }
    .feed-spinner {
      width: 34px; height: 34px;
      border: 3px solid #1a1a1a; border-top-color: #f5a623;
      border-radius: 50%; animation: feed-spin 0.8s linear infinite;
    }
    @keyframes feed-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-player-mode="login">
  <!-- Logo fixo -->
  <img id="logo" src="vision_logo.png" alt="Logo Vision" />

  <!-- Área de login -->
  <div id="codigoInput">
    <input
      type="text"
      id="codigoTela"
      placeholder="Código do display"
      style="text-transform: uppercase;"
      oninput="this.value = this.value.toUpperCase()"
    />
    <button id="btnEntrar">Iniciar</button>
  </div>

  <video id="videoPlayer" autoplay muted playsinline style="display:none"></video>
  <video id="videoPlayerB" autoplay muted playsinline style="display:none"></video>
  <img id="imgPlayer" style="display:none" />
  <!-- Feed de informativos (overlay inline, sem iframe) -->
  <div id="feedPlayer">
    <div id="feed-overlay">
      <div class="feed-spinner"></div>
      <span id="feed-overlay-text">Carregando…</span>
    </div>
    <div id="feed-header">
      <span id="feed-header-title">Informativo</span>
      <span id="feed-header-clock"></span>
    </div>
    <div id="feed-dots"></div>
    <div id="feed-carousel"></div>
    <div id="feed-progress"></div>
  </div>

  <!-- Rodapé -->
  <footer id="rodape"><a href="https://www.mrit.com.br" target="_blank" style="color: inherit; text-decoration: none;">© 2026 MRIT</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <!-- hls.js para buffer via MSE (apenas quando URL for .m3u8) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Capacitor para funcionalidades nativas (APK) -->
  <script type="module" src="/capacitor-setup.js"></script>
  <script src="player.js"></script>

  <script>
    // Forçar fullscreen permanente quando app carregar
    function entrarFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.mozRequestFullScreen) {
        elem.mozRequestFullScreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    }

    // Tentar fullscreen imediatamente ao carregar
    window.addEventListener('load', () => {
      entrarFullscreen();
      // Múltiplas tentativas para garantir
      setTimeout(entrarFullscreen, 100);
      setTimeout(entrarFullscreen, 300);
      setTimeout(entrarFullscreen, 600);
      setTimeout(entrarFullscreen, 1000);
      setTimeout(entrarFullscreen, 2000);
    });

    // Reativar fullscreen se sair
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        setTimeout(entrarFullscreen, 100);
      }
    });

    document.addEventListener('webkitfullscreenchange', () => {
      if (!document.webkitFullscreenElement) {
        setTimeout(entrarFullscreen, 100);
      }
    });

    document.addEventListener('mozfullscreenchange', () => {
      if (!document.mozFullScreenElement) {
        setTimeout(entrarFullscreen, 100);
      }
    });

    document.addEventListener('MSFullscreenChange', () => {
      if (!document.msFullscreenElement) {
        setTimeout(entrarFullscreen, 100);
      }
    });

    // Reativar quando ganha foco
    window.addEventListener('focus', () => {
      entrarFullscreen();
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        entrarFullscreen();
      }
    });

    // Reativar quando página é mostrada
    window.addEventListener('pageshow', () => {
      entrarFullscreen();
    });

    // Reativar quando redimensiona (pode indicar saída do fullscreen)
    window.addEventListener('resize', () => {
      setTimeout(entrarFullscreen, 100);
    });

    // Botão iniciar
    document.getElementById("btnEntrar").addEventListener("click", () => {
      if (typeof startPlayer === 'function') {
        startPlayer();
        // Forçar fullscreen após iniciar
        setTimeout(entrarFullscreen, 100);
        setTimeout(entrarFullscreen, 500);
      }
    });
    
    // SEMPRE forçar fullscreen quando app carregar (APK/PWA)
    window.addEventListener('load', () => {
      const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                    window.navigator.standalone === true ||
                    document.referrer.includes('android-app://');
      
      // Se for APK/PWA, sempre entrar em fullscreen
      if (isPWA) {
        entrarFullscreen();
        setTimeout(entrarFullscreen, 100);
        setTimeout(entrarFullscreen, 300);
        setTimeout(entrarFullscreen, 600);
        setTimeout(entrarFullscreen, 1000);
        setTimeout(entrarFullscreen, 2000);
      }
    });
    
    // Função para verificar se o player está ativo (não está na tela de login)
    function isPlayerAtivo() {
      const codigoInput = document.getElementById("codigoInput");
      const video = document.getElementById("videoPlayer");
      const img = document.getElementById("imgPlayer");
      
      // Se o campo de código está visível, o player NÃO está ativo
      if (codigoInput && codigoInput.style.display !== 'none' && !codigoInput.classList.contains('fade-out')) {
        return false;
      }
      
      // Se vídeo ou imagem estão visíveis, o player está ativo
      if (video && video.style.display !== 'none') {
        return true;
      }
      if (img && img.style.display !== 'none') {
        return true;
      }
      
      return false;
    }
    
    // Funções removidas: simularCliqueNaTela e forcarFocoNoPlayer
    // Essas funções foram removidas pois não são mais necessárias
    
    // SEMPRE reativar fullscreen se sair (modo permanente)
    const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                  window.navigator.standalone === true ||
                  document.referrer.includes('android-app://');
    
    if (isPWA) {
      // Reativar fullscreen quando ganha foco
      window.addEventListener('focus', () => {
        entrarFullscreen();
      });
      
      // Reativar quando fica visível
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          entrarFullscreen();
        }
      });
      
      // Reativar quando página é mostrada
      window.addEventListener('pageshow', () => {
        entrarFullscreen();
      });
      
      // Reativar quando redimensiona
      window.addEventListener('resize', () => {
        clearTimeout(window.resizeTimeout);
        window.resizeTimeout = setTimeout(() => {
          entrarFullscreen();
        }, 100);
      });
      
      // Reativar quando toca na tela
      document.addEventListener('touchstart', () => {
        entrarFullscreen();
      }, { passive: true });
    }
  </script>
</body>
</html>
